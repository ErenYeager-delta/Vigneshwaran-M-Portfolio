services:
  - type: web
    name: vigneshwaran-portfolio
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()'"
    healthCheckPath: /ping
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URI
        sync: false          # Set this secret manually in Render dashboard
      - key: SECRET_KEY
        sync: false          # Set this secret manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false          # Set this secret manually in Render dashboard
      - key: ADMIN_SECRET_PATH
        value: /vignesh-secret-2025
      - key: SITE_URL
        sync: false          # Set to your custom domain e.g. https://vigneshwaran.dev
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
